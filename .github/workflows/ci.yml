name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    name: conformance (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip jsonschema

      - name: Schema and matrix are well-formed JSON
        run: |
          python -c "import json; json.load(open('spec/aiflow-v1.schema.json'))"
          python -c "import json; json.load(open('spec/edge-compatibility.json'))"

      - name: Schema is a valid JSON Schema
        run: |
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open("spec/aiflow-v1.schema.json"))
          jsonschema.Draft202012Validator.check_schema(schema)
          print("schema is a valid draft 2020-12 schema")
          PY

      - name: Validate reference example
        run: python tools/validate.py examples/rag-support-agent.aiflow --strict

      - name: Conformance suite
        run: python tests/test_matrix.py
