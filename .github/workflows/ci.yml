name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    name: conformance (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip jsonschema

      - name: Spec artifacts are well-formed JSON
        run: |
          python -c "import json; json.load(open('spec/aiflow-v1.schema.json'))"
          python -c "import json; json.load(open('spec/edge-compatibility.json'))"

      - name: Schema is itself a valid draft 2020-12 schema
        run: |
          python - <<'PY'
          import json, jsonschema
          jsonschema.Draft202012Validator.check_schema(
              json.load(open("spec/aiflow-v1.schema.json")))
          print("schema is a valid draft 2020-12 schema")
          PY

      - name: Reference example validates strictly
        run: python -m aiflow.cli validate examples/rag-support-agent.aiflow --strict

      - name: Conformance suites
        run: python tests/run_all.py

      # generate -> validate is the round trip the whole toolchain rests on
      - name: Analyzer round trip
        run: |
          python -m aiflow.cli generate examples/sample-project -o /tmp/gen.aiflow
          python -m aiflow.cli validate /tmp/gen.aiflow --strict

      # README diagrams are committed, so they can drift from the code
      - name: README diagrams are current
        run: python docs/build.py --check

      # The semantic analyzer must never need a key or a network call to be tested,
      # and must never spend quota from CI.
      - name: Semantic analyzer stays offline
        env:
          OPENROUTER_API_KEY: ""
        run: |
          python -m aiflow.cli enrich examples/rag-support-agent.aiflow --dry-run
          python -m aiflow.cli enrich --status

      - name: Plugin manifests are well formed
        run: |
          python - <<'PY'
          import json, pathlib, re
          market = json.load(open(".claude-plugin/marketplace.json"))
          plugin = json.load(open("claude-plugin/.claude-plugin/plugin.json"))
          assert re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", plugin["name"]), plugin["name"]
          assert re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", market["name"]), market["name"]
          names = {p["name"] for p in market["plugins"]}
          assert plugin["name"] in names, f'{plugin["name"]} missing from marketplace'
          for entry in market["plugins"]:
              src = entry["source"]
              if isinstance(src, str) and src.startswith("./"):
                  assert pathlib.Path(src).is_dir(), src
          skills = sorted(pathlib.Path("claude-plugin/skills").glob("*/SKILL.md"))
          assert skills, "no skills found"
          for skill in skills:
              body = skill.read_text()
              assert body.startswith("---"), skill
              fm = body.split("---")[1]
              name = re.search(r"^name: (.+)$", fm, re.M).group(1).strip()
              assert name == skill.parent.name, f"{skill}: name {name!r} != dir"
              assert re.search(r"^description: ", fm, re.M), skill
          print(f"plugin ok: {plugin['name']}, {len(skills)} skill(s)")
          PY

  package:
    name: build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # The spec artifacts live once, at the repo root, and are force-included
      # into the wheel. If that wiring breaks, an installed package silently
      # loses its schema -- so install somewhere the checkout is not reachable.
      - name: Install and run outside the checkout
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import aiflow; assert aiflow.schema()['title'] == 'AIFLOW v1'; print('packaged spec resolves')"
          aiflow --version
          aiflow init -o /tmp/demo.aiflow --name demo
          aiflow validate /tmp/demo.aiflow --strict
          aiflow inspect /tmp/demo.aiflow --json > /dev/null
          aiflow render /tmp/demo.aiflow -o /tmp/demo.html
          # the page must not reference anything it would have to fetch at view time
          python - <<'PY'
          import re
          html = open("/tmp/demo.html").read()
          external = [u for u in re.findall(r'(?:src|href)\s*=\s*["\']([^"\']+)', html)
                      if u.startswith(("http://", "https://", "//"))]
          assert not external, external
          print(f"self-contained page: {len(html)} bytes, 0 external references")
          PY
